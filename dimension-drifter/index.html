    <section class="runes-section" aria-label="Magic runes">
      <h2 class="runes-heading">Magic Runes</h2>
      <div class="runes-panel">
        <div class="rune-slot" id="rune-alpha" data-rune="alpha" aria-label="Alpha rune placeholder">

          <span class="rune-label">Alpha Rune</span>
