<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dimension Drifter: The Magic Labyrinth</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="game">
    <header class="game-header">
      <h1 class="game-title">Dimension Drifter</h1>
      <p class="game-tagline">The Magic Labyrinth</p>
      <p class="game-subtitle">Guide your marshmallow blob through the candy maze. Toggle reality with the runes.</p>
    </header>

    <section class="board-section" aria-label="Game board">
      <div class="board" id="board" aria-label="10 by 10 game board"></div>
    </section>

    <section class="runes-section" aria-label="Magic runes">
      <h2 class="runes-heading">Magic Runes</h2>
      <p class="runes-hint">Toggle reality to solve the labyrinth.</p>
      <div class="runes-panel">
        <button
          type="button"
          class="rune-slot"
          id="rune-melt"
          data-rune="melt"
          aria-pressed="false"
          aria-label="Melt Rune — turn chocolate river into a candy bridge"
        >
          <span class="rune-glyph" aria-hidden="true">🍫</span>
          <span class="rune-label">Melt Rune</span>
          <span class="rune-effect">River → Candy Bridge</span>
          <span class="rune-status">Inactive</span>
        </button>
        <button
          type="button"
          class="rune-slot"
          id="rune-tiny"
          data-rune="tiny"
          aria-pressed="false"
          aria-label="Tiny Rune — shrink lollipop guards into passable candies"
        >
          <span class="rune-glyph" aria-hidden="true">🍭</span>
          <span class="rune-label">Tiny Rune</span>
          <span class="rune-effect">Guards → Tiny candies</span>
          <span class="rune-status">Inactive</span>
        </button>
      </div>
    </section>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
