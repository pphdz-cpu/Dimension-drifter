    <section class="runes-section" aria-label="Magic runes">
      <h2 class="runes-heading">Magic Runes</h2>
      <p class="runes-hint">Toggle reality to solve the labyrinth.</p>
      <div class="runes-panel">
        <div class="rune-slot" id="rune-matter" data-rune="matter" aria-label="State of Matter rune placeholder">
          <span class="rune-glyph" aria-hidden="true">🍫</span>
          <span class="rune-label">State of Matter</span>
          <span class="rune-effect">River → Bridge</span>
          <span class="rune-status">Inactive</span>
        </div>
        <div class="rune-slot" id="rune-behavior" data-rune="behavior" aria-label="State of Behavior rune placeholder">
          <span class="rune-glyph" aria-hidden="true">🍭</span>
          <span class="rune-label">State of Behavior</span>
          <span class="rune-effect">Guards → Tiny candies</span>
          <span class="rune-status">Inactive</span>
        </div>
      </div>
